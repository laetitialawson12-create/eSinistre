{% extends "base_chef.html" %}
{% block title %}Renvoyer à l'agent{% endblock %}
{% block content %}
<h4 class="mb-4">Renvoyer le dossier {{ sinistre.numero_sinistre }} à l'agent</h4>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning">Renvoyer à l'agent</button>
    <a href="{% url 'detail_sinistre_chef' sinistre.id %}" class="btn btn-outline-secondary">Annuler</a>
</form>
{% endblock %}
