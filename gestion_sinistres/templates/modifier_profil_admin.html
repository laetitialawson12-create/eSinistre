{% extends 'base_admin.html' %}

{% block title %}Modifier mon profil{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0" style="color: var(--fidelia-blue);">Modifier mes informations</h3>
    <a href="{% url 'profil_admin' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Retour au profil
    </a>
</div>

<form method="post" class="shadow-sm p-4 bg-white rounded">
    {% csrf_token %}
    <div class="row">
        {% for field in form %}
        <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn" style="background: var(--fidelia-blue); color: white;">
        Enregistrer
    </button>
</form>
{% endblock %}
