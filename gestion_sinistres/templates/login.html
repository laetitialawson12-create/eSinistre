<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Fidélia eSinistre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body
    style="background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); min-height: 100vh; display: flex; align-items: center;">
    <div class="card mx-auto shadow" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">
            <h4 class="text-center mb-4" style="color: #003366;">Fidélia eSinistre</h4>
            {% if form.errors %}
            <div class="alert alert-danger">Identifiants incorrects.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Identifiant</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="background-color: #003366;">Se
                    connecter</button>
            </form>
        </div>
    </div>
</body>

</html>
