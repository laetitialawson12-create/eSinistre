{% extends 'base_assure.html' %}

{% block title %}Mes documents{% endblock %}

{% block content %}
<h3 class="mb-4" style="color: #003366;"><i class="bi bi-folder2-open"></i> Mes documents</h3>

<div class="card shadow-sm border-0">
    <div class="card-body">
        {% if pieces %}
        <table class="table table-hover align-middle">
            <!-- Votre contenu de tableau ici -->
            <tbody>
                {% for piece in pieces %}
                <tr>
                    <td>{{ piece.fichier.name }}</td>
                    <!-- ... -->
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-muted">Aucun document disponible.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
