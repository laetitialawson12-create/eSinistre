<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Espace Assuré{% endblock %} - Fidélia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --fidelia-blue: #003366;
        }

        body {
            background-color: #f4f7f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: var(--fidelia-blue);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar a {
            color: rgba(255, 255, 255, 0.85);
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            margin: 2px 10px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
    </style>
</head>

<body>
    <nav class="sidebar">
        <div class="text-center py-4 border-bottom border-light border-opacity-25">
            <h5 class="mb-0">Fidélia eSinistre</h5>
            <small class="opacity-75">{{ request.user.get_full_name|default:request.user.username}}</small>
        </div>
        <div class="py-3">
            <a href="{% url 'accueil_assure' %}"
                class="{% if request.resolver_match.url_name == 'accueil_assure' %}active{% endif %}"><i
                    class="bi bi-house-door me-2"></i> Accueil</a>
            <a href="{% url 'declarer_sinistre' %}"
                class="{% if request.resolver_match.url_name == 'declarer_sinistre' %}active{% endif %}"><i
                    class="bi bi-pencil-square me-2"></i> Nouvelle déclaration</a>
            <a href="{% url 'suivi_sinistres' %}"
                class="{% if request.resolver_match.url_name == 'suivi_sinistres' %}active{% endif %}"><i
                    class="bi bi-list-check me-2"></i> Suivi de mes dossiers</a>
            <a href="{% url 'documents_assure' %}"
                class="{% if request.resolver_match.url_name == 'documents_assure' %}active{% endif %}"><i
                    class="bi bi-folder2-open me-2"></i> Documents</a>
            <a href="{% url 'profil_assure' %}"
                class="{% if request.resolver_match.url_name == 'profil_assure' %}active{% endif %}"><i
                    class="bi bi-person-circle me-2"></i> Profil</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-link" style="color: rgba(255,255,255,0.85); padding: 12px 20px;">
                    <i class="bi bi-box-arrow-right me-2"></i> Déconnexion
                </button>
            </form>
        </div>
    </nav>
    <main class="main-content">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ messages.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>

</html>
