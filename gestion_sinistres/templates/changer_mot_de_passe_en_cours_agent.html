{% extends "base_agent.html" %}
{% block content %}
<div class="card shadow-sm" style="max-width: 500px; margin: 40px auto;">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-3" style="color: var(--fidelia-blue);">Changer mon mot de passe</h4>

        {% if form.errors %}
            <div class="alert alert-danger">Veuillez corriger les erreurs ci-dessous.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Mot de passe actuel</label>
                {{ form.old_password }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Nouveau mot de passe</label>
                {{ form.new_password1 }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Confirmer le nouveau mot de passe</label>
                {{ form.new_password2 }}
            </div>
            <button type="submit" class="btn btn-primary fw-bold" style="background-color: var(--fidelia-blue);">Valider</button>
        </form>
    </div>
</div>
{% endblock %}
